name: Frontend CI

on:
  push:
    branches:
        - frontend
  pull_request:
    branches:
     - frontend
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Tests
        run: npm run test

      - name: Build Project
        run: npm run build

